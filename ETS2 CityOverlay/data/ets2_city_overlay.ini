; ETS2 City Overlay settings. Restart the game after changing.

[overlay]
; 1 = visible at start, 0 = hidden until you press the toggle key
enabled=1
; Toggle key as a Windows virtual-key code (0x78 = F9, 0x79 = F10, 0x7A = F11)
toggle_key=0x78
; 1 = the toggle needs Ctrl held (Ctrl+F9), 0 = the key alone
toggle_ctrl=1
; Ctrl + this key turns the whole plugin off and on: overlay, voice alerts and the AI assistant
; (0x77 = F8). To stop the game loading it at all, run disable_plugin.cmd in this folder.
master_key=0x77
; Any TrueType font installed on Windows
font=C:\Windows\Fonts\segoeuib.ttf
; City name size in pixels at 1080p (scales with resolution)
font_size=34
; Top of the panel as a fraction of screen height (0.035 = just below the top edge)
position_y=0.035
; Seconds the panel stays fully visible after you enter a city
banner_seconds=6
; 1 = keep a dimmed panel on screen afterwards, 0 = hide it after the banner
always_show=1
; Opacity of the dimmed panel (0.0 - 1.0)
idle_opacity=0.70
; 1 = show "Near <city> / 12 km" when you are between cities
show_nearby=1

[voice]
; The voice for everything the plugin says (alerts, turns, the assistant):
;   fish  = fish.audio (e.g. your own cloned voice) first; if it fails it tries once more, then the
;           local voice says it. Short lines that repeat ("Speed limit 60") are kept in
;           voice\fish_cache, so they play at once and cost no request the next time.
;           Needs your fish.audio API key on the first line of fish_audio_key.txt in this folder.
;   piper = only the local voice (a natural neural voice installed in voice\, works offline)
;   windows = the built-in Windows voice
engine=fish
; fish.audio: the voice's reference id (from its page on fish.audio), model, and how it sounds
fish_voice=9556b7bd7e6745479be272016bab0590
fish_model=s2.1-pro-free
fish_temperature=0.7
fish_top_p=0.7
; 1.0 = normal speed (0.5 - 2.0)
fish_speed=1.0
; The local voice (Piper), e.g. en_GB-jenny_dioco-medium, en_GB-cori-high, en_US-lessac-high, en_US-ryan-high
voice_model=en_GB-jenny_dioco-medium
; 1 = say the city name out loud when you enter it
speak=0
; What to say. {city} and {country} are replaced, e.g. "Now entering {city}, {country}"
; (keep this line plain English letters; Windows reads .ini files in the system code page)
text=Welcome to {city}
; Only for engine=windows: part of an installed voice's name, e.g. Zira, David, Hazel.
; Leave empty for the Windows default voice.
voice=
; Volume 0 - 100: fish.audio, and the local voice (it comes out about twice as loud, so it's lower)
volume=100
local_volume=45
; Overall voice level 0 - 100, on top of both. Ctrl+F6 = quieter, Ctrl+F7 = louder (10 at a time);
; the level you choose is saved here.
level=60
quieter_key=0x75
louder_key=0x76
; -10 (slow) to 10 (fast)
rate=0

[announce]
; 1 = speak alerts with the voice above
enabled=1
; What to announce (1 = on)
fuel=1
sleep=1
ferry=1
border=1
destination=1
; Exits, forks, turns and roundabouts ahead, with the lanes to use (about 15 and 6 real seconds
; before; only while the plugin's route matches your GPS)
lanes=1
; "Speed limit 60" when the limit drops and you're above it (speed cameras fine from 5 km/h over)
speed_limit=1
; 1 = also warn while you stay 5 km/h or more over the limit
speeding=0
; Remind you when the headlights are off while driving (low beams are required in the dark, in rain,
; in tunnels, and in daytime in some countries)
headlights=1
; Diesel much cheaper or dearer across the next border on your route (the game's own fuel prices)
fuel_prices=1
; How far ahead (game km) to announce a border crossing and the destination
border_km=10
destination_km=5

[alerts]
; 1 = show low-fuel and sleep warnings with the nearest place ahead
enabled=1
; Warn when the tank has less than this many liters
fuel_warn_liters=100
; The fuel warning turns red below this
fuel_critical_liters=40
; Warn when you need to sleep within this many in-game minutes (the game's own sleep timer)
rest_warn_minutes=120
; How wide "ahead of me" is: degrees either side of where the truck is pointing
search_angle=60
; Ignore places further away than this (game km, as the GPS counts them)
search_distance_km=300
; 1 = also warn when your fuel won't reach the station AFTER the next one (so refuel at the next),
; even with more than fuel_warn_liters in the tank
smart_fuel=1
; 1 = same for sleep: warn when the sleep timer won't last to the rest place after the next one
smart_sleep=1
; Roads are longer than a straight line; distances are multiplied by this when planning
detour_factor=1.3
; Liters to keep in the tank as a margin when planning
reserve_liters=30

[route]
; 1 = work out your job route from the map (used by the fuel/sleep planning and the strip)
enabled=1
; 1 = show the upcoming-stops strip (next cities, fuel, places to sleep, ferries, destination)
strip=1
; Toggle the strip with Ctrl + this key (0x79 = F10)
strip_key=0x79
; How many rows the strip shows
strip_items=7
; Right edge of the strip (fraction of screen width) and its top (fraction of screen height)
strip_x=0.985
strip_y=0.26
; A fuel station or parking counts as "on your route" if visiting it adds at most this many km
max_detour_km=8
; The same for fuel stations (they can be few and far between, e.g. in northern Finland)
max_fuel_detour_km=20
; 1 = show the next exit or turn and which lanes to use, from about 25 seconds before it
guidance=1

[guide]
; AI assistant (Google Gemini, free tier), like a car's built-in voice assistant. It knows where you
; are, the time, your job and what's ahead on the route, and remembers the conversation. It gives a
; route briefing for a new job, facts about the towns and countries you pass, delivery summaries,
; progress updates now and then, and answers your questions. Fuel, sleep and turn warnings stay
; with the navigation voice. Needs your Gemini API key from Google AI Studio: put it on the first
; line of gemini_api_key.txt in this folder (or set the GEMINI_API_KEY environment variable).
; Sent to Google: the situation (place, time, job, route ahead), screenshots and your voice when
; those are on below. Nothing is sent while the assistant is off (enabled=0).
enabled=1
; 1 = it talks by itself; 0 = only when you press the key
auto=1
; Ctrl + this key (0x7A = F11): tap = tell me about where I am, hold = talk to it, let go to send
key=0x7A
; Gemini model that writes the replies (free tier: 500 requests a day, 15 a minute)
model=gemini-3.5-flash-lite
; Used only when that one is used up for the day or busy (free tier: 14,400 a day). Comma-separated;
; empty = never use another model
fallback_models=gemma-4-31b-it
; Voice for its replies: same = the [voice] voice above (fish.audio first, then the local voice),
; google = a Google voice with the Gemini key (free tier: only 10 replies a day)
voice_engine=same
; Google voice: Sulafat warm, Achird friendly, Puck upbeat, Charon informative, Kore firm, Aoede breezy...
google_voice=Sulafat
google_voice_model=gemini-3.8-flash-tts
; 1 = the assistant sees the game picture (a screenshot without this plugin's panels) with every request:
; it's its main source (signs, road, weather, landmarks, the displays)
screenshots=1
; 1 = hold the key and speak to it (uses your default microphone)
listen=1
; Real minutes between its regular camera looks while driving; it speaks only when the picture shows
; something new and useful (0 = never)
look_minutes=2
; At most this many requests to Google a day (Flash Lite allows 500; each reply with the Google voice is two)
daily_limit=450
; 1 = read it out, 1 = show it on screen
speak=1
show=1

[hud]
; A slim bar in the top-right corner: fuel range, time until you must sleep, the speed limit and
; your arrival time (red when you'd be late). Ctrl+F9 hides it with the rest of the overlay.
enabled=1
; Top of the bar, as a fraction of screen height
position_y=0.02

[detection]
; Used only for cities without map boundary data: meters from the centre that count as "in" the city
in_city_radius=1800
; Max distance for the "Near <city>" line, in game km (as the GPS counts them)
near_km=250
; 1 = when you deliver a job, remember the destination city's position (fixes missing/outdated cities)
learn_from_deliveries=1
